<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bác sĩ Minh Hoàng | Trang cá nhân</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #ffffff; max-width: 420px; width: 100%; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); padding: 32px 24px; text-align: center; }
    .avatar { width: 96px; height: 96px; border-radius: 50%; background: #0070f3; color: white; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: bold; margin: 0 auto 16px; }
    h1 { font-size: 22px; color: #1a202c; margin-bottom: 6px; }
    .title { color: #0070f3; font-weight: 600; font-size: 14px; margin-bottom: 12px; }
    .bio { color: #4a5568; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    .btn { display: block; padding: 12px; border-radius: 12px; text-decoration: none; font-weight: 500; font-size: 14px; transition: all 0.2s; }
    .btn-primary { background: #0070f3; color: white; }
    .btn-outline { background: #f7fafc; color: #2d3748; border: 1px solid #e2e8f0; }
    .btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">H</div>
    <h1>Bác sĩ Minh Hoàng</h1>
    <div class="title">Bác sĩ / Y khoa</div>
    <p class="bio">Chào mừng bạn đến với trang thông tin cá nhân. Nơi chia sẻ kiến thức y học, kinh nghiệm lâm sàng và các dự án cá nhân.</p>
    <div class="links">
      <a href="mailto:emailcuaban@gmail.com" class="btn btn-primary">✉️ Gửi Email liên hệ</a>
      <a href="https://facebook.com" class="btn btn-outline" target="_blank">🌐 Trang Facebook</a>
      <a href="https://zalo.me" class="btn btn-outline" target="_blank">💬 Nhắn tin qua Zalo</a>
    </div>
  </div>
</body>
</html>
